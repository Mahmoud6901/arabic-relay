name: Release

# A v* tag builds, tests and smoke-tests the installer, then opens a DRAFT release.
# The owner signs and publishes it offline: python scripts/sign_release.py <tag>
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .[build]
      - name: The tag matches the app version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(python -c 'import arabic_relay; print(arabic_relay.__version__)')"
      - name: Cache Whisper tiny
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub/models--Systran--faster-whisper-tiny
          key: whisper-tiny-d90ca5fe260221311c53c58e660288d3deb8d356
      - name: Whisper tiny for the real speech tests
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-tiny', revision='d90ca5fe260221311c53c58e660288d3deb8d356')"
      - run: python -m unittest discover -s tests -v
      - name: Interface tests
        shell: bash
        run: |
          node tests/test_voice.cjs
          node tests/test_setup.cjs
          node tests/test_translation_ui.cjs
          node tests/test_ship_ui.cjs
      - name: Inno Setup
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build, self-test, installer smoke test
        run: ./scripts/build.ps1 -Smoke
      - name: Checksums and notes
        run: |
          $version = "$env:GITHUB_REF_NAME".Substring(1)
          $name = "ArabicRelay-Setup-$version.exe"
          "$((Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower())  $name" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          python scripts/release_notes.py $version | Set-Content notes.md -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" --draft --title "Arabic Relay $version" --notes-file notes.md \
            "dist/ArabicRelay-Setup-$version.exe" dist/SHA256SUMS.txt
